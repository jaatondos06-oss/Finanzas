<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<meta name="description" content="Ingresos, gastos, tarjetas y deudas con personas, con registro por voz.">
<meta name="theme-color" content="#f5f8fa">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f5f8fa; --card:#ffffff; --card2:#eef3f6; --ink:#1f2a37; --ink2:#6b7785; --line:#e3e9ee;
  --acc:#17a06a; --acc-ink:#ffffff; --acc-soft:#e6f7ef; --acc-txt:#128055;
  --neg:#d9474b; --neg-soft:#fdeeee; --warn:#b26b00; --warn-soft:#fff5e1; --pos:#128055;
  --blue-soft:#e8f1fd;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 10px rgba(16,24,40,.05);
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header.top h1{font-size:26px;margin:0;letter-spacing:-.02em}
main{padding:4px 16px 24px;max-width:640px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:22px 4px 8px;font-weight:600}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .l{font-size:13px;color:var(--ink2)}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.hero{background:linear-gradient(135deg,#e3f6ec,#e4effc);color:var(--ink);border-radius:22px;padding:20px}
.hero .l{color:var(--ink2);font-size:15px;font-weight:600}.hero .v{font-size:34px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .row{display:flex;gap:18px;margin-top:10px;font-size:14px}.hero .row b{display:block;font-size:16px}
.neg{color:var(--neg)}.pos{color:var(--pos)}.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi3 .card{padding:12px}.kpi3 .v{font-size:17px}.kpi3 .l{font-size:12px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.tipos button{background:var(--card);box-shadow:var(--shadow);padding:18px 12px;border-radius:16px;text-align:left;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:16px}.tipos button span{font-size:28px}.tipos button small{font-weight:400;color:var(--ink2);font-size:13px}.muted{color:var(--ink2)}.small{font-size:13px}
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;min-height:56px}
.item:first-child{border-top:0}
.item .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card2);flex:none;font-size:18px}
.item .tx{flex:1;min-width:0}.item .tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx .s{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:650;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item .amt .s{font-size:12px;font-weight:400;color:var(--ink2)}
.empty{padding:22px 16px;text-align:center;color:var(--ink2);font-size:14px}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:5px}
.bar.over>i{background:var(--neg)}
.catrow{display:flex;justify-content:space-between;font-size:14px}
.catrow+.catrow{margin-top:12px}
.alert{border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--ink)}.alert.neg{background:var(--neg-soft);color:var(--ink)}.alert.ok{background:var(--acc-soft)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--card2);color:var(--ink);font-weight:600;cursor:pointer}
.btn.pri,button.pri{background:var(--acc);color:var(--acc-ink)}
.btn.danger,button.danger{background:var(--neg-soft);color:var(--neg)}
.btn.block,button.block{width:100%}
.btn.sm,button.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:8px 14px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;border:0;color:var(--ink)}
.chip.on{background:var(--acc);color:var(--acc-ink)}
label.f{display:block;font-size:13px;color:var(--ink2);margin:10px 2px 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;background:transparent;font-size:14px;border-radius:9px}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);font-weight:600;min-width:60px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc-txt)}
nav.tabs .mic{width:62px;height:62px;border-radius:50%;background:var(--acc);color:var(--acc-ink);margin-top:-30px;box-shadow:0 6px 18px rgba(23,160,106,.35);justify-content:center;min-width:0}
nav.tabs .mic svg{width:28px;height:28px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility .25s;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.sheet.on{transform:none;visibility:visible}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-size:20px;margin:4px 0 6px}
.sheet .acts{display:flex;gap:10px;margin-top:16px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.sheet .acts>*{flex:1}
.draft{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.draft+.draft{margin-top:12px}
.understood{background:var(--acc-soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;opacity:0;transition:all .2s;font-size:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{background:none;color:#6ee7b7;padding:0;font-size:14px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.monthnav b{font-size:17px;text-transform:capitalize}
.dateh{font-size:13px;color:var(--ink2);margin:16px 4px 6px;font-weight:600;text-transform:capitalize}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,160,106,.5)}70%{box-shadow:0 0 0 14px rgba(23,160,106,0)}100%{box-shadow:0 0 0 0 rgba(23,160,106,0)}}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 34px;font-size:15px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--acc-soft);color:var(--acc-txt);font-weight:700;font-size:13px;display:grid;place-items:center}
code,.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card2);padding:2px 6px;border-radius:6px;word-break:break-all}
.copybox{display:flex;gap:8px;align-items:center;margin:6px 0}
.copybox .code{flex:1;padding:8px 10px}
details{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:0 16px}
details+details{margin-top:10px}
details summary{padding:14px 0;font-weight:650;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
details>div{padding-bottom:14px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--ink2);vertical-align:1px}
</style>
</head>
<body>
<header class="top"><h1 id="title">Inicio</h1><div id="topact"></div></header>
<main id="main"></main>

<nav class="tabs">
  <button data-v="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button class="mic" id="micBtn" aria-label="Registrar por voz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button data-v="cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Cuentas</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';
/* ================== Datos ================== */
const KEY = 'misfinanzas.v1';
const CATS = ['Comida','Súper','Gasolina','Transporte','Casa','Servicios','Salud','Escuela','Entretenimiento','Ropa','Suscripciones','Regalos','Otros','Sueldo','Negocio','Otros ingresos'];
const CAT_IC = {Comida:'🌮','Súper':'🛒',Gasolina:'⛽',Transporte:'🚕',Casa:'🏠',Servicios:'💡',Salud:'💊',Escuela:'🎓',Entretenimiento:'🎬',Ropa:'👕',Suscripciones:'📺',Regalos:'🎁',Otros:'🧾',Sueldo:'💼',Negocio:'📈','Otros ingresos':'💵'};
const TIPO_CTA = {cuenta:'Efectivo', debito:'Tarjeta de débito', credito:'Tarjeta de crédito', persona:'Persona'};
const esDinero = c => c && (c.tipo==='cuenta'||c.tipo==='debito');
const DEFAULT_MODELS = ['gemini-3.1-flash-lite','gemini-2.5-flash-lite','gemini-2.5-flash'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function hoy(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function defaultState(){
  return {v:1,
    cuentas:[{id:uid(),nombre:'Efectivo',tipo:'cuenta',saldoInicial:0,alias:['efectivo','cash'],creado:Date.now()}],
    movs:[],
    ajustes:{apiKey:'',modelo:DEFAULT_MODELS[0],leerVoz:true,presupuesto:0,cuentaDefault:null,ultimoRespaldo:0,comercios:{},bienvenida:false}};
}
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY)); if(j&&Array.isArray(j.cuentas)){j.ajustes=Object.assign(defaultState().ajustes,j.ajustes||{});j.movs=j.movs||[];return j}}catch(e){}
  return defaultState();
}
let S = load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar en este navegador')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ================== Utilidades ================== */
const fmt = new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'});
const $ = s=>document.querySelector(s);
function money(n){return fmt.format(Math.round((+n||0)*100)/100)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim()}
function cta(id){return S.cuentas.find(c=>c.id===id)}
function r2(n){return Math.round(n*100)/100}
function parseMonto(s){
  if(typeof s==='number')return s;
  let t=String(s||'').replace(/[^\d.,-]/g,'');
  if(!t)return 0;
  if(t.includes(',')&&t.includes('.')) t=t.replace(/,/g,'');
  else if(t.includes(',')){const p=t.split(','); t=(p.length===2&&p[1].length<=2)?p[0]+'.'+p[1]:t.replace(/,/g,'')}
  const n=parseFloat(t); return isNaN(n)?0:Math.abs(n);
}
function fechaLarga(f){const d=new Date(f+'T12:00:00');return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}
function mesLabel(y,m){return new Date(y,m,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'})}

function saldos(){
  const b={}; S.cuentas.forEach(c=>b[c.id]=+c.saldoInicial||0);
  for(const m of S.movs){
    if((m.tipo==='gasto'||m.tipo==='transferencia')&&b[m.desde]!==undefined) b[m.desde]-=m.monto;
    if((m.tipo==='ingreso'||m.tipo==='transferencia')&&b[m.hacia]!==undefined) b[m.hacia]+=m.monto;
  }
  for(const k in b)b[k]=r2(b[k]);
  return b;
}
function describeSaldo(c,b){
  if(esDinero(c)) return {txt:money(b), cls:b<0?'neg':''};
  if(c.tipo==='credito'){const d=-b; return {txt:d>0?'Debes '+money(d):(d<0?'Saldo a favor '+money(-d):'Sin deuda'), cls:d>0?'neg':'pos'}}
  if(b>0) return {txt:'Te debe '+money(b),cls:'pos'};
  if(b<0) return {txt:'Le debes '+money(-b),cls:'neg'};
  return {txt:'A mano',cls:'muted'};
}
function icCuenta(c){return c.tipo==='credito'?'💳':c.tipo==='persona'?'👤':c.tipo==='debito'?'🏦':'💵'}

function proximoDia(dia,desde=new Date()){
  if(!dia)return null; const d=new Date(desde.getFullYear(),desde.getMonth(),1);
  const make=(y,m)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(dia,last))};
  let x=make(d.getFullYear(),d.getMonth()); const t=new Date(desde.getFullYear(),desde.getMonth(),desde.getDate());
  if(x<t)x=make(d.getFullYear(),d.getMonth()+1); return x;
}
function diasHasta(dt){const t=new Date();t.setHours(0,0,0,0);return Math.round((dt-t)/864e5)}

/* ================== Navegación ================== */
let VIEW='inicio', MES=(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()}})(), FILTRO={q:'',cuenta:'',cat:''};
document.querySelectorAll('nav.tabs button[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
function go(v){VIEW=v;document.querySelectorAll('nav.tabs button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();window.scrollTo(0,0)}
function render(){
  const T={inicio:'Inicio',movs:'Movimientos',cuentas:'Cuentas',ajustes:'Ajustes'};
  $('#title').textContent=T[VIEW]; $('#topact').innerHTML='';
  ({inicio:vInicio,movs:vMovs,cuentas:vCuentas,ajustes:vAjustes})[VIEW]();
}

/* ================== Vista: Inicio ================== */
function vInicio(){
  const b=saldos(); let dinero=0,deudaTc=0,teDeben=0,leDebes=0;
  S.cuentas.filter(c=>!c.archivada).forEach(c=>{const v=b[c.id];
    if(esDinero(c))dinero+=v; else if(c.tipo==='credito'){if(v<0)deudaTc+=-v} else {if(v>0)teDeben+=v; else leDebes+=-v}});
  const ym=hoy().slice(0,7); let ing=0,gas=0; const porCat={};
  S.movs.filter(m=>m.fecha.startsWith(ym)).forEach(m=>{
    if(m.tipo==='ingreso')ing+=m.monto;
    if(m.tipo==='gasto'){gas+=m.monto;porCat[m.categoria||'Otros']=(porCat[m.categoria||'Otros']||0)+m.monto}});
  let h='';
  const avisos=[];
  S.cuentas.filter(c=>c.tipo==='credito'&&!c.archivada&&c.diaPago).forEach(c=>{
    const deuda=-b[c.id]; if(deuda<=0)return; const d=proximoDia(c.diaPago), n=diasHasta(d);
    if(n<=7) avisos.push(`<div class="alert ${n<=2?'neg':'warn'}">⏰<div>Paga tu <b>${esc(c.nombre)}</b> ${n===0?'<b>hoy</b>':n===1?'<b>mañana</b>':'en '+n+' días'}: ${money(deuda)}</div></div>`);
  });
  const diasResp=S.ajustes.ultimoRespaldo?Math.floor((Date.now()-S.ajustes.ultimoRespaldo)/864e5):null;
  if(S.movs.length>=5&&(diasResp===null||diasResp>=7)) avisos.push(`<div class="alert warn">💾<div>Haz un respaldo de tus datos. <a href="#" onclick="exportar();return false" style="color:inherit;font-weight:700">Respaldar</a></div></div>`);
  if(avisos.length) h+=`<div class="stack" style="margin-bottom:12px">${avisos.join('')}</div>`;

  h+=`<div class="hero"><div class="l">💵 Tu dinero</div><div class="v">${money(dinero)}</div><div class="small muted" style="margin-top:2px">Efectivo y débito</div></div>
  <div class="kpi3" style="margin-top:10px">
   <div class="card kpi"><div class="l">💳 Debes en tarjetas</div><div class="v ${deudaTc?'neg':''}">${money(deudaTc)}</div></div>
   <div class="card kpi"><div class="l">🙋 Te deben</div><div class="v ${teDeben?'pos':''}">${money(teDeben)}</div></div>

function ordenMov(a,b){return b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0)}
function itemCuenta(c,b){
  const s=describeSaldo(c,b[c.id]); let sub=(c.tipo==='persona'||c.tipo==='cuenta')?'':TIPO_CTA[c.tipo];
  if(c.tipo==='credito'){const bits=[]; if(c.limite)bits.push('Te quedan '+money(c.limite+b[c.id])); if(c.diaPago)bits.push('pagas el día '+c.diaPago); sub=bits.join(' · ')||'Tarjeta de crédito'}
  return `<div class="item" onclick="sheetCuenta('${c.id}')"><div class="ic">${icCuenta(c)}</div><div class="tx"><div class="t">${esc(c.nombre)}</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div><div class="amt ${s.cls}">${s.txt}</div></div>`;
}
function tituloMov(m){
  const d=cta(m.desde),h=cta(m.hacia), dn=d?d.nombre:'¿?', hn=h?h.nombre:'¿?';
  if(m.tipo==='transferencia'){
    if(h&&h.tipo==='credito'&&d&&d.tipo!=='credito')return 'Pago a '+hn;
    if(h&&h.tipo==='persona')return 'A '+hn+(d&&d.tipo==='persona'?'':' (préstamo/abono)');
    if(d&&d.tipo==='persona')return 'De '+dn+' (préstamo/abono)';
    return dn+' → '+hn;
  }
  return m.desc||m.categoria||(m.tipo==='ingreso'?'Ingreso':'Gasto');
}
function itemMov(m){
  const d=cta(m.desde),h=cta(m.hacia);
  const ic=m.tipo==='transferencia'?'↔️':(CAT_IC[m.categoria]||(m.tipo==='ingreso'?'💵':'🧾'));
  let sub=m.tipo==='gasto'?(d?d.nombre:'¿?'):m.tipo==='ingreso'?(h?h.nombre:'¿?'):'Movimiento';
  if(m.tipo!=='transferencia'&&m.desc&&m.categoria)sub=m.categoria+' · '+sub;
  const sign=m.tipo==='ingreso'?'+':m.tipo==='gasto'?'−':'';
  return `<div class="item" onclick="sheetMov('${m.id}')"><div class="ic">${ic}</div><div class="tx"><div class="t">${esc(tituloMov(m))}</div><div class="s">${esc(sub)}${m.origen==='applepay'?' · Apple Pay':m.origen==='voz'?' · 🎙️':''}</div></div><div class="amt ${m.tipo==='ingreso'?'pos':''}">${sign}${money(m.monto)}<div class="s">${new Date(m.fecha+'T12:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'})}</div></div></div>`;
}

  if(tipo==='credito'){data.limite=parseMonto($('#cLimite').value)||0;data.diaCorte=Math.min(31,parseInt($('#cCorte').value)||0)||null;data.diaPago=Math.min(31,parseInt($('#cPago').value)||0)||null}
  if(id)Object.assign(cta(id),data); else S.cuentas.push(Object.assign({id:uid(),creado:Date.now()},data));

function borrarCuenta(id){

}

/* ---------- Gemini ---------- */
function contextoCuentas(){return S.cuentas.filter(c=>!c.archivada).map(c=>`- id:${c.id} | ${c.nombre} | ${c.tipo}${c.alias&&c.alias.length?' | también le dice: '+c.alias.join(', '):''}`).join('\n')}
function promptGemini(texto,corr){
  const d=new Date(); const def=cta(S.ajustes.cuentaDefault);
  return `Eres el asistente de una app personal de finanzas en México (pesos MXN). Convierte lo que dijo el usuario en movimientos contables.

HOY: ${d.toLocaleDateString('es-MX',{weekday:'long'})} ${hoy(d)}.

CUENTAS DEL USUARIO (usa exactamente estos id):
${contextoCuentas()}
(tipo "cuenta" = efectivo; "debito" = tarjeta de débito o cuenta de banco; "credito" = tarjeta de crédito; "persona" = alguien con quien hay deudas)

CATEGORÍAS VÁLIDAS: ${CATS.join(', ')}

TIPOS DE MOVIMIENTO:
- "gasto": sale dinero de "desde" (hacia=null). Si "desde" es tarjeta de crédito, su deuda sube. Si "desde" es una persona, significa que esa persona pagó por el usuario y ahora el usuario le debe (ej. "le debo 200 a Juan de la pizza" = gasto 200, desde=Juan, categoría Comida).
- "ingreso": entra dinero a "hacia" (desde=null). Ej. sueldo, ventas, regalos.
- "transferencia": dinero de "desde" a "hacia". Úsala para: pagar una tarjeta (desde=cuenta, hacia=tarjeta); prestarle a alguien o abonarle a quien le debo (desde=cuenta, hacia=persona); que alguien me preste o me pague lo que me debía (desde=persona, hacia=cuenta); traspasos entre cuentas.

REGLAS:
- monto siempre positivo, número sin símbolos. "mil quinientos" = 1500, "dos mil" = 2000.
- Si menciona una persona que NO está en la lista, usa "NUEVA" como id y pon su nombre (con mayúscula inicial) en "nuevaPersona".
- Si en un gasto/ingreso/préstamo no dice qué cuenta usó, usa ${def?`"${def.id}" (${def.nombre})`:'null'} y avísalo en "dudas".
- fecha en formato AAAA-MM-DD; interpreta "ayer", "el viernes", etc. Por defecto HOY.
- "descripcion": corta, en español (ej. "Tacos", "Gasolina Pemex", "Préstamo a Luis").
- Puede haber varios movimientos en una sola frase.
- "resumen": una o dos frases en español, en segunda persona, explicando lo que vas a registrar y cómo cambian las deudas (ej. "Registro un gasto de $350 en Gasolina con tu tarjeta BBVA; tu deuda con BBVA sube.").
- "dudas": texto corto si algo fue ambiguo o supuesto; si no, "".
${corr?`\nANTES interpretaste la frase "${corr.textoOriginal}" así:\n${JSON.stringify(corr.previo)}\nEl usuario ahora te corrige: "${texto}". Aplica la corrección y devuelve la versión completa y corregida.\n`:`\nFRASE DEL USUARIO: "${texto}"\n`}
Responde SOLO JSON con esta forma:
{"movimientos":[{"tipo":"gasto|ingreso|transferencia","monto":0,"desde":"id|NUEVA|null","hacia":"id|NUEVA|null","nuevaPersona":"","categoria":"","descripcion":"","fecha":"AAAA-MM-DD"}],"resumen":"","dudas":""}`;
}
async function interpretarGemini(texto,corr){
  const key=S.ajustes.apiKey; if(!key)throw new Error('Falta la clave');
  const modelos=[...new Set([S.ajustes.modelo,...DEFAULT_MODELS].filter(Boolean))];
  let last;
  for(const mo of modelos){
    let res;
    try{res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mo)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:promptGemini(texto,corr)}]}],generationConfig:{temperature:0.1,responseMimeType:'application/json'}})})}
    catch(e){throw new Error('sin conexión')}
    if(res.status===404||(res.status===400&&!/API key/i.test(await res.clone().text()))){last=new Error('modelo '+mo+' no disponible');continue}
    if(res.status===429)throw new Error('llegaste al límite gratis por ahora');
    if(res.status===400||res.status===403)throw new Error('la clave no es válida');
    if(!res.ok){last=new Error('error '+res.status);continue}
    const j=await res.json(); const txt=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    let o; try{o=JSON.parse(txt.replace(/^```json|```$/g,'').trim())}catch(e){throw new Error('respuesta rara')}
    return Object.assign(limpiarGemini(o),{modelo:mo});
  }
  throw last||new Error('sin modelo');
}
function limpiarGemini(o){
  const ok=id=>id&&cta(id)?id:null; const drafts=[];
  (o.movimientos||[]).forEach(m=>{
    const tipo=['gasto','ingreso','transferencia'].includes(m.tipo)?m.tipo:'gasto';
    const d={tipo,monto:r2(parseMonto(m.monto)),desde:null,hacia:null,categoria:CATS.includes(m.categoria)?m.categoria:(tipo==='transferencia'?'':'Otros'),desc:String(m.descripcion||'').slice(0,80),fecha:/^\d{4}-\d\d-\d\d$/.test(m.fecha)?m.fecha:hoy()};
    const np=String(m.nuevaPersona||'').trim();
    const fix=v=>v==='NUEVA'&&np?nuevaPersonaRef(np):ok(v);
    if(tipo!=='ingreso')d.desde=fix(m.desde); if(tipo!=='gasto')d.hacia=fix(m.hacia);
    if(d.monto>0)drafts.push(d);
  });
  return {drafts,resumen:String(o.resumen||''),dudas:String(o.dudas||'')};
}
function nuevaPersonaRef(nombre){
  const ex=S.cuentas.find(c=>c.tipo==='persona'&&norm(c.nombre)===norm(nombre)); if(ex)return ex.id;
  return 'new:'+nombre.replace(/\b\w/g,x=>x.toUpperCase());
}

/* ---------- Modo básico (sin internet / sin clave) ---------- */
const CAT_KW={Gasolina:'gasolina gas pemex oxxo gas combustible shell mobil',Comida:'taco tacos comida comer restaurante cena desayuno almuerzo lonche cafe starbucks pizza hamburguesa burger sushi carne asada birria mariscos rappi didi food uber eats antojo',
 'Súper':'super supermercado walmart soriana ley costco sams mandado despensa bodega aurrera heb city club oxxo seven 7 eleven abarrotes',Transporte:'uber didi taxi camion estacionamiento caseta peaje transporte',
 Servicios:'luz cfe agua internet telmex telcel izzi totalplay megacable celular recarga gas natural',Suscripciones:'netflix spotify disney hbo max prime youtube icloud suscripcion apple music chatgpt',
 Salud:'farmacia doctor medico medicina consulta dentista hospital guadalajara similares benavides',Escuela:'escuela colegiatura libros universidad ebc inscripcion copias papeleria',
 Entretenimiento:'cine bar fiesta concierto boletos juego videojuego steam playstation antro cheve cerveza',Ropa:'ropa zapatos tenis liverpool coppel zara shein nike',Casa:'casa renta muebles home depot mueble',Regalos:'regalo cumpleanos',
 Sueldo:'sueldo nomina quincena salario pago de trabajo',Negocio:'venta ventas cliente negocio comision'};
function adivinaCat(t,tipo){const n=' '+norm(t)+' ';for(const [c,kw] of Object.entries(CAT_KW)){if(tipo==='gasto'&&(c==='Sueldo'||c==='Negocio'))continue;if(kw.split(' ').some(k=>k.length>2&&n.includes(' '+k+' ')))return c}return tipo==='ingreso'?'Otros ingresos':'Otros'}
function buscaCuentas(t){
  const n=' '+norm(t)+' '; const hits=[];
  S.cuentas.filter(c=>!c.archivada).forEach(c=>{[c.nombre,...(c.alias||[])].map(norm).filter(Boolean).forEach(a=>{const i=n.indexOf(' '+a+' ');if(i>=0)hits.push({c,i,len:a.length})})});
  hits.sort((a,b)=>a.i-b.i||b.len-a.len); const seen=new Set(); return hits.filter(h=>!seen.has(h.c.id)&&seen.add(h.c.id));
}
function montoDeTexto(t){
  let m=String(t).match(/\$?\s*(\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+(?:\.\d{1,2})?)\s*(mil\b|k\b)?/i);
  if(m){let v=parseMonto(m[1]);if(m[2])v*=1000;return v}
  const W={un:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,veinte:20,treinta:30,cuarenta:40,cincuenta:50,cien:100,ciento:100,doscientos:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
  const w=norm(t).match(/\b(?:(?:un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|veinte|treinta|cuarenta|cincuenta|cien|ciento|doscientos|trescientos|cuatrocientos|quinientos|seiscientos|setecientos|ochocientos|novecientos|mil)(?: y | |$))+/);
  if(w){let tot=0,cur=0;w[0].trim().split(' ').forEach(x=>{if(x==='mil'){tot+=(cur||1)*1000;cur=0}else if(W[x])cur+=W[x]});return tot+cur}
  return 0;
}
const RX_DEBO=/ (le debo|debo a|le quedo a deber) /, RX_MEPRESTO=/ (me presto|me prestaron|me fio) /,
  RX_LEDOY=/ (le preste|preste a|le di|le pague|le abone|le deposite|le transferi|le devolvi) /,
  RX_MEDA=/ (me pago|me dio|me abono|me devolvio|me deposito|me regreso|me transfirio|me pagaron lo) /,
  RX_INGRESO=/ (me pagaron|cobre|recibi|me depositaron|ingreso|ingrese|gane|vendi|me cayo|quincena|sueldo|nomina) /,
  RX_PAGOTC=/ (pague|abone|liquide|pago a|pago de|deposite) /;
function interpretarLocal(t){
  const n=' '+norm(t)+' '; const monto=r2(montoDeTexto(t));
  if(!monto)return {drafts:[],dudas:'No encontré un monto en lo que dijiste.'};
  const hits=buscaCuentas(t); const per=hits.find(h=>h.c.tipo==='persona'); const otras=hits.filter(h=>h.c.tipo!=='persona');
  const def=S.ajustes.cuentaDefault, dudas=[];
  const hayDeuda=[RX_DEBO,RX_MEPRESTO,RX_LEDOY,RX_MEDA,/ me debe /].some(r=>r.test(n));
  let P=per?per.c.id:null;
  if(!P&&hayDeuda){
    const m=String(t).match(/(?:\ba|\bde)\s+([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)/)||String(t).match(/([A-ZÁÉÍÓÚÑ][a-záéíóúñ]+)\s+me\s+/);
    if(m&&!['La','El','Los','Las','Mi','Tarjeta','Efectivo','Le','Me','Ayer','Hoy'].includes(m[1]))P=nuevaPersonaRef(m[1]);
  }
  const cuenta=(otras[0]&&otras[0].c.id)||def||null;
  const d={tipo:'gasto',monto,desde:null,hacia:null,categoria:'Otros',desc:'',fecha:hoy()};
  if(/ ayer /.test(n)){const x=new Date();x.setDate(x.getDate()-1);d.fecha=hoy(x)}
  if(/ (antier|antier|antes de ayer) /.test(n)){const x=new Date();x.setDate(x.getDate()-2);d.fecha=hoy(x)}
  const tcHit=otras.find(h=>h.c.tipo==='credito');
  const conTc=tcHit&&/ con( la| mi| tarjeta)* $/.test(n.slice(0,tcHit.i+1));
  if(P&&RX_MEPRESTO.test(n)) Object.assign(d,{tipo:'transferencia',desde:P,hacia:cuenta,categoria:'',desc:'Préstamo'});
  else if(P&&RX_DEBO.test(n)) Object.assign(d,{tipo:'gasto',desde:P,categoria:adivinaCat(t,'gasto')});
  else if(P&&RX_LEDOY.test(n)) Object.assign(d,{tipo:'transferencia',desde:cuenta,hacia:P,categoria:'',desc:/pague|abone|devolvi/.test(n)?'Abono':'Préstamo'});
  else if(P&&RX_MEDA.test(n)) Object.assign(d,{tipo:'transferencia',desde:P,hacia:cuenta,categoria:'',desc:'Me pagó'});
  else if(P&&/ me debe /.test(n)) Object.assign(d,{tipo:'transferencia',desde:cuenta,hacia:P,categoria:'',desc:'Préstamo'});
  else if(tcHit&&!conTc&&RX_PAGOTC.test(n)){
    const src=otras.find(h=>esDinero(h.c))?.c.id||def; Object.assign(d,{tipo:'transferencia',desde:src,hacia:tcHit.c.id,categoria:'',desc:'Pago de tarjeta'});
  } else if(RX_INGRESO.test(n)) Object.assign(d,{tipo:'ingreso',hacia:cuenta,categoria:adivinaCat(t,'ingreso')});
  else Object.assign(d,{tipo:'gasto',desde:cuenta,categoria:adivinaCat(t,'gasto')});
  if(d.tipo!=='transferencia'&&!d.desc){const m=norm(t).match(/ (?:en|de) (?:el |la |los |las |un |una |unos |unas )?([a-zñ]+(?: [a-zñ]+)?)/);
    if(m){let x=m[1].split(' ');if(['con','en','de','y','a','para','que'].includes(x[1]))x=[x[0]];x=x.join(' ');
      if(!/^(efectivo|tarjeta|debito|credito|pesos|mi|la|el)$/.test(x)&&!S.cuentas.some(c=>norm(c.nombre)===x))d.desc=x.replace(/^\w/,y=>y.toUpperCase())}}
  const necesita=(d.tipo==='gasto'&&!d.desde)||(d.tipo==='ingreso'&&!d.hacia)||(d.tipo==='transferencia'&&(!d.desde||!d.hacia));
  if(necesita)dudas.push('No dijiste con qué cuenta; elígela abajo.');
  else if(!otras.length&&def&&!(d.tipo==='gasto'&&d.desde===P))dudas.push('No dijiste la cuenta; puse '+cta(def).nombre+'.');
  return {drafts:[d],resumen:'',dudas:dudas.join(' ')};
}

/* ---------- Confirmación ---------- */
function explica(d){
  const nm=id=>id&&id.startsWith('new:')?id.slice(4)+' (nueva)':(cta(id)?.nombre||'¿?');
  const D=d.desde&&!d.desde.startsWith('new:')?cta(d.desde):(d.desde?{tipo:'persona'}:null);
  const H=d.hacia&&!d.hacia.startsWith('new:')?cta(d.hacia):(d.hacia?{tipo:'persona'}:null);
  const $m=money(d.monto||0), f=d.fecha===hoy()?'hoy':fechaLarga(d.fecha);
  if(d.tipo==='gasto'){ if(!D)return `Gasto de ${$m}: falta elegir con qué pagaste.`;
    const cat=d.categoria?` en ${d.categoria}`:'';
    if(D.tipo==='credito')return `Gasto de ${$m}${cat} con tu tarjeta ${nm(d.desde)}, ${f}. Tu deuda con ${nm(d.desde)} sube.`;
    if(D.tipo==='persona')return `${nm(d.desde)} pagó ${$m}${cat} por ti, ${f}. Ahora le debes ${$m} más.`;
    return `Gasto de ${$m}${cat} pagado con ${nm(d.desde)}, ${f}.`}
  if(d.tipo==='ingreso'){ if(!H)return `Ingreso de ${$m}: falta elegir a qué cuenta entró.`;
    if(H.tipo==='credito')return `Abono/reembolso de ${$m} a tu tarjeta ${nm(d.hacia)}, ${f}. Tu deuda baja.`;
    if(H.tipo==='persona')return `${nm(d.hacia)} ahora te debe ${$m} más, ${f}.`;
    return `Ingreso de ${$m} a ${nm(d.hacia)}${d.categoria?' ('+d.categoria+')':''}, ${f}.`}
  if(!D||!H)return `Movimiento de ${$m}: elige de dónde sale y a dónde va.`;
  if(d.desde===d.hacia)return 'El origen y el destino no pueden ser la misma cuenta.';
  if(H.tipo==='credito')return `Pagas ${$m} a tu tarjeta ${nm(d.hacia)} desde ${nm(d.desde)}, ${f}. Tu deuda con ${nm(d.hacia)} baja.`;
  if(H.tipo==='persona')return `Le das ${$m} a ${nm(d.hacia)} desde ${nm(d.desde)}, ${f}. Si le debías, tu deuda baja; si no, ahora te debe.`;
  if(D.tipo==='persona')return `${nm(d.desde)} te da ${$m} a ${nm(d.hacia)}, ${f}. Si te debía, su deuda baja; si no, ahora le debes.`;
  if(D.tipo==='credito')return `Sacas ${$m} de tu tarjeta ${nm(d.desde)} a ${nm(d.hacia)} (disposición). Tu deuda sube.`;
  return `Pasas ${$m} de ${nm(d.desde)} a ${nm(d.hacia)}, ${f}.`;
}
function optsCuentas(sel,d){
  const news=[...new Set(PEND.drafts.flatMap(x=>[x.desde,x.hacia]).filter(v=>v&&v.startsWith('new:')))];
  let h=`<option value="">— Elige —</option>`;
  [[['cuenta','debito'],'Efectivo y débito'],[['credito'],'Tarjetas de crédito'],[['persona'],'Personas']].forEach(([ts,l])=>{const t=ts[0];
    const cs=S.cuentas.filter(c=>ts.includes(c.tipo)&&(!c.archivada||c.id===sel)); let o=cs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nombre)}</option>`).join('');
    if(t==='persona')o+=news.map(v=>`<option value="${esc(v)}" ${v===sel?'selected':''}>➕ ${esc(v.slice(4))} (nueva)</option>`).join('')+`<option value="__new">➕ Otra persona…</option>`;
    if(o)h+=`<optgroup label="${l}">${o}</optgroup>`});
  return h;
}
function renderConfirm(hablar){
  const P=PEND; const edit=!!P.editId;
  let h=`<h3>${edit?'Editar movimiento':P.fuente==='voz'?'¿Entendí bien?':P.fuente==='applepay'?'Nuevo cargo':'Nuevo movimiento'}</h3>`;
  if(P.texto)h+=`<div class="small muted">Dijiste: “${esc(P.texto)}”${P.modo?` <span class="tag">${esc(P.modo)}</span>`:''}</div>`;
  if(P.dudas)h+=`<div class="alert warn" style="margin-top:10px">⚠️<div>${esc(P.dudas)}</div></div>`;
  if(P.aviso)h+=`<div class="alert warn" style="margin-top:10px">${P.aviso}</div>`;
  h+=`<div style="margin-top:12px">`+P.drafts.map((d,i)=>`<div class="draft" data-i="${i}">${cardDraft(d,i)}</div>`).join('')+`</div>`;
  if(P.fuente==='voz')h+=`<label class="f" style="margin-top:14px">¿Algo está mal? Dilo y lo corrijo</label><div style="display:flex;gap:8px"><input id="corrTxt" placeholder="Ej. no, fue con la Nu y eran 450"><button class="sm" onclick="corregir()">Corregir</button></div>`;
  h+=`<div class="acts">${edit?`<button class="danger" onclick="borrarMov('${P.editId}')">Eliminar</button>`:`<button onclick="closeSheet()">Cancelar</button>`}<button class="pri" onclick="guardarDrafts()">${edit?'Guardar':P.drafts.length>1?'Guardar '+P.drafts.length:'Guardar'}</button></div>`;
  openSheet(h); bindDrafts();
  if(hablar&&S.ajustes.leerVoz&&window.speechSynthesis){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance((P.resumen||P.drafts.map(explica).join(' '))+' ¿Lo guardo?');u.lang='es-MX';u.rate=1.05;speechSynthesis.speak(u)}catch(e){}}
}
function cardDraft(d,i){
  const lblD=d.tipo==='gasto'?'¿Con qué pagaste?':'¿De dónde sale?', lblH=d.tipo==='ingreso'?'¿A dónde entró?':'¿A dónde va?';
  return `<div class="seg">${['gasto','ingreso','transferencia'].map(t=>`<button type="button" class="${d.tipo===t?'on':''}" data-t="${t}">${t==='transferencia'?'Pago o préstamo':t==='gasto'?'Gasté':'Me entró'}</button>`).join('')}</div>
   <div class="row2"><div><label class="f">Monto</label><input data-f="monto" inputmode="decimal" value="${d.monto||''}" placeholder="0.00"></div><div><label class="f">Fecha</label><input data-f="fecha" type="date" value="${d.fecha}"></div></div>
   ${d.tipo!=='ingreso'?`<label class="f">${lblD}</label><select data-f="desde">${optsCuentas(d.desde,d)}</select>`:''}
   ${d.tipo!=='gasto'?`<label class="f">${lblH}</label><select data-f="hacia">${optsCuentas(d.hacia,d)}</select>`:''}
   ${d.tipo!=='transferencia'?`<label class="f">¿En qué?</label><select data-f="categoria">${CATS.map(c=>`<option ${d.categoria===c?'selected':''}>${c}</option>`).join('')}</select>`:''}
   <label class="f">Nota</label><input data-f="desc" value="${esc(d.desc)}" placeholder="Opcional">
   ${d._tarjetaWallet&&!d._aliasConocido?`<div class="small muted" style="margin-top:6px">Tarjeta en Wallet: “${esc(d._tarjetaWallet)}”. La recordaré para la cuenta que elijas.</div>`:''}
   <div class="understood" data-exp>${esc(explica(d))}</div>
   ${PEND.drafts.length>1?`<button class="sm danger" style="margin-top:8px" onclick="PEND.drafts.splice(${i},1);renderConfirm()">Quitar este</button>`:''}`;
}
function bindDrafts(){
  document.querySelectorAll('.draft').forEach(box=>{
    const i=+box.dataset.i, d=PEND.drafts[i];
    box.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const t=b.dataset.t; if(t===d.tipo)return;
      if(t==='gasto'){d.desde=d.desde||d.hacia;d.hacia=null;if(!d.categoria)d.categoria='Otros'}
      if(t==='ingreso'){d.hacia=d.hacia||d.desde;d.desde=null;d.categoria=CATS.indexOf(d.categoria)>=13?d.categoria:'Otros ingresos'}
      if(t==='transferencia'){d.categoria=''}
      d.tipo=t;box.innerHTML=cardDraft(d,i);bindDrafts()});
    box.querySelectorAll('[data-f]').forEach(el=>{el.oninput=el.onchange=()=>{const f=el.dataset.f;
      if(f==='monto')d.monto=r2(parseMonto(el.value));
      else if((f==='desde'||f==='hacia')&&el.value==='__new'){const n=(prompt('Nombre de la persona:')||'').trim();if(n){d[f]=nuevaPersonaRef(n)}box.innerHTML=cardDraft(d,i);bindDrafts();return}
      else d[f]=el.value||null;
      if(f==='fecha'&&!d.fecha)d.fecha=hoy();
      box.querySelector('[data-exp]').textContent=explica(d)}});
  });
}
async function corregir(){
  const t=$('#corrTxt').value.trim(); if(!t)return;
  const b=document.querySelector('#corrTxt+button'); b.innerHTML='<span class="spin"></span>';
  if(S.ajustes.apiKey){const prev=PEND.drafts.map(d=>({tipo:d.tipo,monto:d.monto,desde:d.desde,hacia:d.hacia,categoria:d.categoria,descripcion:d.desc,fecha:d.fecha}));
    await procesarTexto(t,{textoOriginal:PEND.texto,previo:prev})}
  else {await procesarTexto(PEND.texto+'. '+t)}
}
function guardarDrafts(){
  const P=PEND;
  for(const d of P.drafts){
    if(!(d.monto>0))return toast('Falta el monto');
    if(d.tipo!=='ingreso'&&!d.desde)return toast(d.tipo==='gasto'?'Elige con qué pagaste':'Elige de dónde sale');
    if(d.tipo!=='gasto'&&!d.hacia)return toast(d.tipo==='ingreso'?'Elige a qué cuenta entró':'Elige a dónde va');
    if(d.tipo==='transferencia'&&d.desde===d.hacia)return toast('Origen y destino son iguales');
  }
  const creadas={}; const prevS=JSON.stringify(S);
  const res=v=>{if(!v||!v.startsWith('new:'))return v; const n=v.slice(4); if(!creadas[n]){const ex=S.cuentas.find(c=>c.tipo==='persona'&&norm(c.nombre)===norm(n));
      if(ex)creadas[n]=ex.id; else{const c={id:uid(),nombre:n,tipo:'persona',saldoInicial:0,alias:[],creado:Date.now()};S.cuentas.push(c);creadas[n]=c.id}} return creadas[n]};
  P.drafts.forEach(d=>{
    const m={id:d.id||uid(),tipo:d.tipo,monto:r2(d.monto),desde:d.tipo==='ingreso'?null:res(d.desde),hacia:d.tipo==='gasto'?null:res(d.hacia),
      categoria:d.tipo==='transferencia'?'':(d.categoria||'Otros'),desc:(d.desc||'').trim(),fecha:d.fecha||hoy(),creado:d.creado||Date.now(),origen:d.origen||P.fuente||'manual'};
    if(d._tarjetaWallet){const c=cta(m.desde); const a=norm(d._tarjetaWallet); if(c&&a&&!(c.alias||[]).includes(a)){c.alias=[...(c.alias||[]),a]}}
    if(d._comercio&&m.categoria)S.ajustes.comercios[norm(d._comercio)]=m.categoria;
    if(P.editId){const k=S.movs.findIndex(x=>x.id===P.editId);S.movs[k]=m} else S.movs.push(m);
  });
  save();closeSheet();render();
  toast(P.editId?'Actualizado':(P.drafts.length>1?P.drafts.length+' movimientos guardados':'Guardado ✓'),()=>{S=JSON.parse(prevS);save();render();toast('Deshecho')});
  PEND=null;
}
function borrarMov(id){const prevS=JSON.stringify(S);S.movs=S.movs.filter(m=>m.id!==id);save();closeSheet();render();toast('Eliminado',()=>{S=JSON.parse(prevS);save();render()})}

/* ================== Entradas desde Atajos (Siri / Apple Pay) ================== */
function leerHash(){
  const h=location.hash.slice(1); if(!h)return;
  history.replaceState(null,'',location.pathname+location.search);
  if(h.startsWith('voz=')){const t=decodeURIComponent(h.slice(4).replace(/\+/g,' '));setTimeout(()=>sheetVoz(t,true),50);return}
  if(h.startsWith('cargo')){
    const p=new URLSearchParams(h.slice(5).replace(/^&/,''));
    const monto=r2(parseMonto(p.get('monto'))), comercio=(p.get('comercio')||'').trim(), tarjeta=(p.get('tarjeta')||'').trim();
    const tn=norm(tarjeta);
    let c=tn&&S.cuentas.find(x=>x.tipo!=='persona'&&!x.archivada&&((x.alias||[]).includes(tn)||norm(x.nombre)===tn));
    if(!c&&tn)c=S.cuentas.find(x=>x.tipo!=='persona'&&!x.archivada&&(tn.includes(norm(x.nombre))||norm(x.nombre).includes(tn)));
    const cat=S.ajustes.comercios[norm(comercio)]||adivinaCat(comercio,'gasto');
    const d={tipo:'gasto',monto,desde:c?c.id:null,hacia:null,categoria:cat,desc:comercio,fecha:hoy(),origen:'applepay',_tarjetaWallet:tarjeta,_aliasConocido:!!c,_comercio:comercio};
    const dup=S.movs.find(m=>m.origen==='applepay'&&m.monto===monto&&norm(m.desc)===norm(comercio)&&Date.now()-(m.creado||0)<3*60e3);
    PEND={drafts:[d],fuente:'applepay',aviso:dup?'⚠️<div>Ya registraste un cargo igual hace unos minutos. ¿Es otro?</div>':''};
    setTimeout(()=>renderConfirm(),50);
  }
}
window.addEventListener('hashchange',leerHash);

/* ================== Bienvenida ================== */
function bienvenida(){
  openSheet(`<h3>👋 Bienvenido a Mis Finanzas</h3>
  <div class="stack" style="margin-top:8px;font-size:15px">
   <div>Aquí llevas tus <b>ingresos y gastos</b>, lo que debes en cada <b>tarjeta</b> y quién te debe o a quién le debes.</div>
   <div>Lo más rápido: toca el <b>micrófono</b> (o di “Oye Siri, gasto” cuando lo configures) y habla normal. Antes de guardar te digo lo que entendí para que lo corrijas.</div>
   <div>Empieza agregando tus cuentas y tarjetas con su saldo de hoy.</div>
  </div>
  <div class="acts"><button onclick="S.ajustes.bienvenida=true;save();closeSheet()">Después</button><button class="pri" onclick="S.ajustes.bienvenida=true;save();closeSheet();go('cuentas')">Agregar cuentas</button></div>`);
}

render();
if(location.hash)leerHash(); else if(!S.ajustes.bienvenida)bienvenida();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
